<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="380" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#061121"/>
    </linearGradient>
  </defs>

  <!-- Architectural Icon -->
  <g transform="translate(10, 8)">
    <rect width="64" height="64" rx="12" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Stylized Architectural Z and Tower Building -->
    <path d="M18 48 L46 48 L22 22 L50 22" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="18" r="3.5" fill="#F5D77F"/>
    <!-- Vertical Building lines -->
    <line x1="26" y1="36" x2="26" y2="44" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
    <line x1="34" y1="30" x2="34" y2="44" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
    <line x1="42" y1="24" x2="42" y2="44" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="90" y="38" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">
    ZIPPY <tspan fill="url(#goldGrad)">ENTERPRISES</tspan>
  </text>
  <text x="92" y="56" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#C5A059" letter-spacing="3">
    CONSTRUCTION SOLUTIONS &amp; DEVELOPMENT
  </text>
</svg>
